<head>

<body class="home-page">

        <div class="envelope" id="letter1">

        <div class="envelope fromHer" id="letter2">

            <div class="flap"></div>
            <div class="waxSeal"></div>
        </div>
        <div class="envelope" id="letter3">
            <div class="cover"></div>
            <div class="background"></div>

        </div>
</div>
